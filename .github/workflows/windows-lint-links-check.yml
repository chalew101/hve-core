name: Windows lint:links check (temporary)

on:
  workflow_dispatch: {}
  push:
    branches:
      - fix/lint-dependency-pinning-pwsh-invocation
    paths:
      - .github/workflows/windows-lint-links-check.yml

permissions:
  contents: read

jobs:
  lint-links-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run lint:links via cmd.exe
        shell: cmd
        run: npm run lint:links
